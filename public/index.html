<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4f5f7">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Home Climate">
  <title>Home Climate</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="shell">
    <header>
      <p class="eyebrow">Home</p>
      <h1>Climate</h1>
      <p id="updated" class="updated">Loading readings…</p>
    </header>

    <section id="rooms" class="cards" aria-live="polite"></section>

    <p id="error" class="error" hidden></p>

    <section id="history-section" class="history" aria-labelledby="history-heading">
      <div class="history-head">
        <div class="history-title">
          <h2 id="history-heading" tabindex="-1">Last 24 hours</h2>
          <p id="history-status" role="status">Loading history…</p>
        </div>
        <label>Room <select id="history-room" disabled></select></label>
      </div>
      <p id="history-error" class="error" role="status" hidden></p>
      <details id="history-details" hidden>
        <summary>Collection details</summary>
        <p id="history-freshness" class="updated"></p>
      </details>
      <div id="history-charts"></div>
      <p class="history-note">Times are local. Gaps mark missing or unavailable readings. Timestamps show when readings were collected.</p>
    </section>
  </main>

  <script src="/app.js" defer></script>
  <script type="module" src="/history.js"></script>
</body>
</html>
